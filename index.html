        <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>StayHard!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .glass { background: rgba(28, 28, 30, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .sanction-border { border: 2px solid #FF453A !important; }
        .pulse-red { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-6 flex flex-col min-h-screen">

    <!-- Header & Status -->
    <header class="mt-8 mb-10 text-center">
        <h1 class="text-4xl font-black tracking-tighter uppercase italic italic">Stay Hard!</h1>
        <div id="status-tag" class="text-[10px] tracking-[0.3em] font-bold uppercase mt-2 text-gray-500">Discipline Active</div>
    </header>

    <!-- Streak Display -->
    <div id="main-card" class="glass rounded-[32px] p-8 mb-8 text-center transition-all duration-500">
        <div class="text-xs font-bold text-gray-400 uppercase mb-1">Workout Streak</div>
        <div id="streak-val" class="text-7xl font-black tracking-tighter">0</div>
        <div id="last-seen" class="text-[10px] text-gray-500 mt-4 uppercase">Dernière séance : Jamais</div>
    </div>

    <!-- AI Tools Section -->
    <div class="grid grid-cols-2 gap-4 mb-8">
        <button onclick="document.getElementById('meal-input').click()" class="glass rounded-[24px] p-6 flex flex-col items-center">
            <div class="w-10 h-10 mb-3 bg-[#FF453A]/10 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-[#FF453A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
            </div>
            <span class="text-[11px] font-bold uppercase tracking-widest text-gray-300">Scanner</span>
        </button>
        <input type="file" id="meal-input" class="hidden" accept="image/*" onchange="analyzeImage('meal')">

        <button onclick="document.getElementById('body-input').click()" class="glass rounded-[24px] p-6 flex flex-col items-center">
            <div class="w-10 h-10 mb-3 bg-[#FF453A]/10 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-[#FF453A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
            <span class="text-[11px] font-bold uppercase tracking-widest text-gray-300">Physique</span>
        </button>
        <input type="file" id="body-input" class="hidden" accept="image/*" onchange="analyzeImage('body')">
    </div>

    <!-- AI Output -->
    <div id="ai-response" class="glass rounded-[24px] p-6 mb-8 hidden">
        <div id="ai-text" class="text-sm font-medium text-gray-200 leading-relaxed italic"></div>
    </div>

    <!-- CTA Button -->
    <button onclick="logWorkout()" class="mt-auto bg-[#FF453A] text-black font-black py-5 rounded-[24px] uppercase tracking-widest text-sm hover:scale-[0.98] transition-transform">
        Validé (Aujourd'hui)
    </button>

    <script type="module" src="main.js"></script>
</body>
</html>
